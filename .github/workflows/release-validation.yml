name: Windows release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-safety:
    name: Real Windows Shell safety checks
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc

      # Only synthetic temporary files are recycled on this disposable runner.
      - name: Verify real Windows Recycle Bin behavior
        run: cargo test --locked --test windows_shell -- --ignored --test-threads=1 --nocapture
